<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1b2b">
<meta name="description" content="Dharm Textiles weave costing calculator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Dharm Textiles – Weave Costing</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="side">
 <div class="brand"><div class="logo">D</div><div><b>Dharm Textiles</b><small>FABRIC COSTING ERP</small></div></div>
 <button class="nw" data-a="new"><b>+ New quality</b><small>Reset everything</small></button>
 <div class="grp">MAIN TOOLS</div>
 <button data-v="calc"><b>Fabric calculator</b><small>Warp, weft &amp; costing</small></button>
 <button data-v="saved"><b>Saved qualities <span id="qn"></span></b><small>Saved qualities database</small></button>
 <button data-v="yarn"><b>Yarn requirement</b><small>Order yarn planning</small></button>
 <button data-v="draw"><b>Weaving drawing</b><small>Dobby drawing &amp; print</small></button>
 <button data-v="sim"><b>Fabric simulation</b><small>Warp, peg &amp; weft weave view</small></button>
 <button data-v="loom"><b>Loom RPM simulator</b><small>Loom speed &amp; production</small></button>
 <div class="grp">PRINTS &amp; SLIPS</div>
 <button data-v="sheet"><b>Cost sheet (print/PDF)</b><small>Full costing sheet</small></button>
 <button data-v="job"><b>Job card slip (A4)</b><small>Loom shed weaver slip</small></button>
 <button data-a="report"><b>Print / PDF report</b><small>Choose what to print</small></button>
 <div class="sp"></div>
 <button class="bk" data-a="upload"><b>Upload PDF / image</b><small>Read peg plan, drawing, details</small></button>
 <input type="file" id="upl" accept=".pdf,application/pdf,image/*" hidden>
 <button class="bk" data-a="backup"><b>Full backup (all data)</b><small>Qualities, pattern, peg plan, drawing, lattice</small></button>
 <button class="bk" data-a="restore"><b>Restore backup</b><small>Load a backup (.json or old .csv)</small></button>
 <input type="file" id="file" accept=".json,.csv,application/json" hidden>
<input type="file" id="docfile" multiple accept="image/*,.pdf,application/pdf" hidden>
</nav>
<div id="allsheet" class="sheet" style="max-width:none"></div>
<div id="latsheet" class="sheet"></div>
<div id="drawsheet" class="sheet dp"></div>
<div id="pegsheet" class="sheet pgp" style="max-width:none;border:0;box-shadow:none"></div>
<main class="main"><div class="wrap" id="app"></div></main>

<script src="js/app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
