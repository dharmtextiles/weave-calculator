<title>Dharm Textiles – Weave Costing</title>
<style>
:root{--ink:#0b1b2b;--teal:#0e7490;--cyan:#06b6d4;--gold:#fcd34d;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--mut:#64748b;--ok:#15803d;--madder:#9b2c2c}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 "Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.side{position:fixed;inset:0 auto 0 0;width:270px;max-width:86vw;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;z-index:30;overflow:auto;transform:translateX(-102%);transition:transform .22s ease;box-shadow:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.logo{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#11022d;display:block}
.brand b{font-size:16px;display:block;line-height:1.1}.brand small{color:var(--mut);font-size:10px;letter-spacing:.5px}
.side button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 12px;border-radius:9px;color:var(--ink);margin-bottom:3px;border-left:3px solid transparent}
.side button b{display:block;font-size:13px}.side button small{display:block;color:var(--mut);font-size:10.5px}
.side button:hover{background:#f1f5f9}.side button.on{background:var(--ink);color:#fff;border-left-color:var(--cyan)}.side button.on small{color:#9fb3c8}
.side button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.side .sp{flex:1}.side .grp{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--mut);padding:12px 8px 5px}
.side .bk{background:#ecfdf5;border:1px solid #bbf7d0;margin-top:4px}
.main{margin-left:0;padding:56px 28px 40px}
.main>.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 16px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;font:inherit;font-weight:600}
.btn:hover{border-color:var(--teal)}.btn.p{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.d{color:var(--madder)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.dk h2,.tl h2{margin:-16px -16px 14px;padding:10px 16px;border-radius:10px 10px 0 0;color:#fff;letter-spacing:.4px}
.dk h2{background:#050b12}.tl h2{background:var(--teal)}.dk,.tl{overflow:hidden}
.tag{background:var(--gold);color:var(--ink);padding:2px 10px;border-radius:5px;font-size:12px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#f8fafc;position:relative}
label{display:block;font-size:11px;color:var(--mut)}
input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;color:var(--ink);margin-top:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv b,.big,.hl b,.stat b,.tag{font-family:Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}.big{font-size:22px}
.hl{background:#ecfeff;border:1px solid #a5f3fc;border-radius:8px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.hl b{font-size:19px}.good{color:var(--ok)}.bad{color:var(--madder)}
.x{position:absolute;right:6px;top:-9px;background:#fff;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:16px;padding:0;color:var(--madder)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.qc{border-color:#a5f3fc}.qc .t{font-size:16px;font-weight:700}.qc .m{color:var(--mut);font-size:12px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--ink);color:#fff;padding:14px;border-radius:10px}.stat small{color:#9fb3c8;display:block}.stat b{font-size:19px}
.stats.lt .stat{border:1px solid var(--line);background:#fff;color:var(--ink)}.stats.lt .stat small{color:var(--mut)}
.stats.lt .stat:nth-child(2){background:#ecfeff;border-color:#a5f3fc}.stats.lt .stat:nth-child(3){background:#f0fdf4;border-color:#bbf7d0}
.sheet{background:#fff;max-width:820px;margin:0 auto;padding:28px 32px;border:1px solid var(--line);box-shadow:0 2px 12px #0002}
.sheet h3{margin:0;font-size:24px}.sheet table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.sheet th,.sheet td{border:1px solid #bbb;padding:6px 8px;text-align:right}.sheet th{background:#eef2f6}.sheet td:first-child,.sheet th:first-child{text-align:left}
.sheet .hd{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.sig{display:flex;justify-content:space-between;margin-top:50px;font-size:12px}.sig span{border-top:1px solid #333;padding-top:4px;width:30%;text-align:center}
.jc{color:var(--madder)}.jc h3{color:var(--madder)}
.jl{display:flex;align-items:baseline;border-bottom:1px solid var(--madder);font-size:13px;padding:2px 0}.jl span{min-width:80px;font-weight:600}
.jl input{border:0;background:transparent;margin:0;padding:2px 4px;color:#222;border-radius:0}
.j3{display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:0 8px;border-bottom:1px solid var(--madder);font-size:13px}
.j3 input{border:0;margin:0;padding:3px 4px;background:transparent;color:#222}.j3 span{font-weight:600;padding:3px 0}
.empty{color:var(--mut);padding:30px;text-align:center}
.tabs{display:flex;gap:6px;margin:-4px 0 12px}.tabs button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:8px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.p-sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line);vertical-align:-2px}
.pat .mn{font-family:Consolas,monospace;font-size:12px;word-break:break-word;margin-top:6px}
.row select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;margin-top:2px;background:#fff;color:var(--ink)}
.pat select,.pat button.pb{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.pat button.pb{cursor:pointer}.pat button.pb:hover{border-color:var(--teal)}
.pat input[type=number]{width:78px;margin:0}.pat input[type=text]{width:120px;margin:0}.pat input[type=color]{width:34px;height:28px;padding:1px;margin:0}
.pat table{border-collapse:collapse;width:100%;margin:6px 0}.pat td,.pat th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.p-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.p-stat{flex:1 1 120px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:8px;padding:8px 10px;font-size:11px;color:var(--mut)}
.p-stat b{display:block;font:700 18px Consolas,monospace;color:var(--ink)}
.p-card{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.p-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;margin:4px 0}
.p-grp{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;background:#f5f3fb}.p-grp .p-grp{background:#fbf3e8}.p-grp .p-grp .p-grp{background:#eef4f1}
.p-gh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.p-ch{margin-left:12px;border-left:3px solid var(--teal);padding-left:8px}
.p-sp{flex:1}.p-tot{font-size:12px;color:var(--mut);white-space:nowrap}.p-tot b{color:var(--ink)}
.pvw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}#pcv{display:block}.pvz{font-size:11px;color:var(--mut);margin-right:8px}.edw{margin-left:10px;font-size:12px;color:var(--mut);white-space:nowrap}.edw input{width:80px}
.peg .bar{margin:6px 0}.peg label{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink)}
.peg input[type=number]{width:64px;margin:0}.peg input[type=text]{margin:0}
.peg button.pb{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}.peg button.pb:hover{border-color:var(--teal)}.peg button.pb.d{color:var(--madder)}
.pg-wrap{overflow-x:auto;max-width:100%}.pg-wrap table{border-collapse:collapse}
.pg-wrap th{background:var(--ink);color:#fff;padding:4px 6px;font-size:11px}
.pg-wrap td{border:1px solid var(--line);padding:0;text-align:center;height:26px;font-size:12px}
td.pg-g{width:28px;min-width:28px;cursor:pointer;user-select:none}td.pg-g:hover{background:#ecfeff}
td.pg-g.on{background:var(--ink);color:#fff;font-weight:700}td.pg-n{min-width:34px;padding:0 6px;font-weight:700;background:#f1f5f9}td.pg-c{min-width:34px;color:var(--mut)}
tr.pg-end td{border-bottom:2px solid var(--ink)}td.pg-t input{width:170px;border:0;padding:4px 6px;margin:0;border-radius:0}td.pg-a{white-space:nowrap;padding:0 4px}
td.pg-a button{padding:1px 6px;font-size:12px;margin:0 1px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
#pegsheet{display:none}
.pgp table{border-collapse:collapse;margin-top:10px}.pgp th,.pgp td{border:1px solid #888;padding:0;text-align:center;font-size:11px;height:19px;min-width:19px}
.pgp th{background:#0b1b2b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pgp td.on{background:#0b1b2b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pgp td.l{padding:0 6px;font-weight:700}.pgp td.sh{text-align:left;padding:0 6px;font-size:10px;white-space:nowrap}.pgp tr.e td{border-bottom:2px solid #000}
@media print{body.pp .side,body.pp .main{display:none!important}body.pp #pegsheet{display:block}}
.drw .bar{margin:6px 0}.drw label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px}.drw label.ck{flex-direction:row;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
.drw input[type=checkbox]{width:auto;margin:0}.drw input{margin:0}
.dr-params{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}.dr-params .wide{grid-column:1/-1}
.drw button.pb,.drw select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px}.drw button.pb{cursor:pointer}.drw button.pb:hover{border-color:var(--teal)}
.dr-wrap{overflow-x:auto;max-width:100%}.dr-t{width:100%;border-collapse:collapse}.dr-t th{background:var(--ink);color:#fff;font-size:11px;text-align:left;padding:5px}
.dr-t td{border:1px solid var(--line);padding:3px;vertical-align:middle}tr.dr-first td{border-top:2px solid var(--teal)}
.dr-t td input[type=number]{width:64px}.dr-sh{width:130px;font-family:Consolas,monospace}.dr-x{width:52px!important}
.chip{display:inline-flex;align-items:center;gap:2px;border:2px solid;border-radius:8px;padding:2px;margin:2px}.chip input{width:46px!important}.chip select{max-width:110px;border-color:transparent}
.chip button{padding:1px 6px;border:0;background:none;color:inherit;cursor:pointer}
.br{font-size:20px;color:var(--mut);display:none}.hasx .br{display:inline}
.dr-act{display:flex;flex-wrap:wrap;gap:3px;min-width:110px}.dr-act button{padding:2px 7px!important}
.dr-yt{border-collapse:collapse;margin:6px 0}.dr-yt td,.dr-yt th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;font-size:12px}
#app.wide{max-width:none}.main>.wrap.wide{max-width:none}
.dr-top{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;margin:0 0 6px;border-bottom:1px solid var(--line)}.dr-top .bar{margin:0}
#drawsheet{display:none}.dp table{border-collapse:collapse;margin:8px 0;width:100%}.dp th,.dp td{border:1px solid #888;padding:3px 6px;font-size:11px;text-align:left;vertical-align:middle}
.dp th{background:#0b1b2b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dp tr.f td{border-top:2px solid #000}.dp .mono{font-family:Consolas,monospace}
.dp .pc{display:inline-block;padding:1px 6px;border-radius:5px;margin:1px;border:1px solid #666;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dp .sw{display:inline-block;width:12px;height:12px;border:1px solid #444;vertical-align:-2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{body.pd .side,body.pd .main{display:none!important}body.pd #drawsheet{display:block}}
.lat .bar{margin:6px 0}.lat label{font-size:11px;color:var(--mut);display:block}
.lat input[type=number]{width:90px;margin:0}.lat input[type=color]{width:44px;height:28px;padding:1px;margin:0}
.lat select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:150px}
.lat button.pb{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}.lat button.pb:hover{border-color:var(--teal)}
.l-t{border-collapse:collapse;width:100%;margin:6px 0}.l-t th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:4px 6px}.l-t td{padding:3px 6px;border-top:1px solid var(--line);font-size:13px}
.l-strip{display:flex;flex-direction:column;width:220px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
.l-strip div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-bottom:1px solid rgba(0,0,0,.18);-webkit-print-color-adjust:exact;print-color-adjust:exact}.l-strip div:last-child{border-bottom:0}
.lat pre{white-space:pre-wrap;margin:8px 0 0;font:12px Consolas,monospace;background:#f8fafc;padding:10px;border-radius:8px;border:1px solid var(--line)}
#latsheet{display:none}
@media print{body.pl .side,body.pl .main{display:none!important}body.pl #latsheet{display:block}#latsheet table{border-collapse:collapse;margin:6px 0}#latsheet th,#latsheet td{border:1px solid #888;padding:4px 10px;font-size:12px;text-align:left}#latsheet th{background:#0b1b2b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:860px){.main{padding:56px 14px 14px}.grid{grid-template-columns:1fr}.row{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}
@media print{.side,.bar{display:none!important}.main{margin:0;padding:0}.sheet{border:0;box-shadow:none;max-width:none;padding:0}body{background:#fff}.jl input,.j3 input{color:#000}@page{size:A4;margin:10mm}}

.side button.nw{background:var(--teal);color:#fff;margin-bottom:6px}.side button.nw small{color:#cffafe}.side button.nw:hover{background:#0b6177}
#mdl{position:fixed;inset:0;background:#0b1b2b99;z-index:50;display:grid;place-items:center}#mdl .box{background:#fff;border-radius:12px;padding:18px 20px;width:min(580px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px #0005}
.mk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;color:var(--ink);font-size:13px}.mk input{width:auto;margin:3px 0 0}
#allsheet{display:none}.fmlw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:8px}.fmlbox{margin:8px 0 12px}.tile{break-inside:avoid;page-break-inside:avoid;margin:0 0 8px}.tile small{display:block;font-size:11px;color:#444;margin:2px 0}.tile img{display:block;border:1px solid #999;max-width:100%;height:auto}.mk select{margin-left:auto}.rs{page-break-before:always}.rs:first-child{page-break-before:auto}
.rl table{border-collapse:collapse;margin:6px 0}.rl th,.rl td{border:1px solid #888;padding:4px 10px;font-size:12px;text-align:left}.rl th{background:#0b1b2b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{body.pa .side,body.pa .main,body.pa #mdl{display:none!important}body.pa #allsheet{display:block}}

.dr-bn{text-align:center;font-weight:700;font-size:15px;background:#f1f5f9;min-width:44px}.dr-seq{min-width:290px;max-width:380px}.dr-chips{display:flex;flex-wrap:wrap;gap:3px;min-height:28px;padding:3px;border:1px dashed var(--line);border-radius:6px;background:#f8fafc;margin-bottom:3px;align-items:center}
.dr-chips em{color:var(--mut);font-size:11px;padding:0 4px}.dr-chips button.sc{font:700 12px Consolas,monospace;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:2px 6px;cursor:pointer}.dr-chips button.sc:hover{background:var(--madder)}.dr-chips button.sc.bad{background:var(--madder);outline:2px solid #fca5a5}
.dr-pal{display:flex;flex-wrap:wrap;gap:2px}.dr-pal button{min-width:26px;height:24px;padding:0 2px;font:600 11px Consolas,monospace;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}.dr-pal button:hover{background:var(--teal);color:#fff;border-color:var(--teal)}.dr-pal button.u{padding:0 7px;color:var(--madder);font-family:inherit}
.dr-cnt{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:5px!important;color:var(--ink)!important;font-size:12px!important}.dr-cnt input{width:80px}
.pgo-sh{display:flex;flex-wrap:wrap;margin:6px 0 4px}.pgo-sh label{display:inline-flex;align-items:center;gap:3px;margin:2px 10px 2px 0;font-size:12px;color:var(--ink)}.pgo-sh input{width:auto;margin:0}
.pgo-r{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:8px 0}.pgo-r label{font-size:11px;color:var(--mut)}.pgo-r input{width:90px;margin:0;display:block}
#pdfbusy{position:fixed;right:16px;bottom:16px;background:#0b1b2b;color:#fff;padding:10px 14px;border-radius:8px;z-index:99;font-size:13px}
.p-no{display:inline-block;min-width:26px;text-align:center;background:var(--ink);color:#fff;border-radius:5px;padding:1px 6px;font:700 11px Consolas,monospace}
.p-cp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:6px 8px;border:1px dashed var(--teal);border-radius:8px;background:#f0fdfa;font-size:12px}
.p-cp input{width:64px!important;margin:0!important}
.grid.pf{grid-template-columns:minmax(0,1fr)}.grid.pf>div:nth-child(2),.grid.pf .wft{display:none}
.pat button.pb.cp{background:#ecfeff}

/* ---- collapsible menu ---- */
.menubtn{position:fixed;top:10px;left:12px;z-index:25;cursor:pointer;border:1px solid var(--line);background:var(--ink);color:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px #0003}
.menubtn:hover{background:var(--teal)}
.menubtn .bars{font-size:16px;line-height:1}
body.menu-open .side{transform:none;box-shadow:4px 0 24px #0004}
.scrim{position:fixed;inset:0;background:#0b1b2b66;z-index:29;display:none}
body.menu-open .scrim{display:block}
@media print{.menubtn,.scrim{display:none!important}}

/* ---- warp / weft rows: boxes sized to their titles ---- */
.row.fitrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
label.fit{display:block;flex:0 0 auto;max-width:100%}
label.fit>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.fit input,label.fit select{width:100%;min-width:0}
.rw{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px 22px;border-top:1px dashed var(--line);padding-top:7px;margin-top:2px;font-size:12px;color:var(--mut)}
.rw b,.sectot b{font-family:Consolas,"Courier New",monospace;color:var(--ink)}
.sectot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 22px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:8px;padding:10px 12px;margin-top:10px;font-weight:600;color:var(--ink)}
.sectot b{font-size:15px;margin-left:6px}

/* ---- results sit beneath the weft section ---- */
.results{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.results>.card{margin-bottom:0}

/* ---- text size control (menu) ---- */
.side .fsz{display:flex;align-items:center;gap:6px;padding:2px 4px 8px}
.side .fsz button{width:auto;flex:0 0 auto;text-align:center;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;padding:7px 12px;margin:0;border-radius:8px;border-left-width:1px}
.side .fsz button:hover{background:#ecfeff;border-color:var(--teal)}
.side .fsz button.rs{font-size:11px;font-weight:600;margin-left:auto}
.side .fsz span{flex:1;text-align:center;font:700 13px Consolas,monospace;color:var(--ink)}
@media print{.main{zoom:1!important}}

/* ---- Google Drive sync chip ---- */
.syncchip{position:fixed;top:10px;left:112px;z-index:25;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font:600 12px/1 inherit;font-family:inherit;box-shadow:0 2px 8px #0002}
.syncchip[hidden]{display:none}
.syncchip[data-s=ok]{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.syncchip[data-s=busy],.syncchip[data-s=pending]{border-color:#a5f3fc;background:#ecfeff;color:#0e7490}
.syncchip[data-s=err],.syncchip[data-s=reauth]{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
@media print{.syncchip{display:none!important}}

/* ---- warp draft / repeat groups / drawing calc ---- */
.gb{display:inline-block;background:#fde68a;color:#78350f;border-radius:4px;font:700 10px Consolas,monospace;padding:1px 5px;margin:2px 1px}
.gr{align-items:center;gap:6px;margin:6px 0}.gr input{width:72px}
.warn{background:#fef2f2;color:#9b2c2c;border:1px solid #fecaca;border-radius:6px;padding:6px 10px;margin:6px 0;font-size:12px}.warn[hidden]{display:none}
.us-g{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.us{position:relative;min-width:64px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;text-align:center;background:linear-gradient(to top,#a5f3fc var(--w),#fff var(--w))}
.us b{display:block;font:700 12px Consolas,monospace;color:var(--ink)}.us span{font:600 12px Consolas,monospace;color:#0e7490}.us.z{background:#fff;opacity:.55}.us.bad{border-color:#fca5a5}
.dfw-in .p-stats,.drw .p-stats{margin-bottom:8px}

<script>
/* Google Drive automatic sync (browser only, no server).
   - Stores one JSON file + attachment files in the hidden "appDataFolder" of the user's own Drive
     (scope drive.appdata: this app cannot see any other Drive file, and the files do not show in My Drive).
   - Merges data from every device (newest save of each quality wins; deletions are remembered).
   Relies on globals from app.js: S, Q, save, render, normS, idbGet, idbPut. */
(function () {
  'use strict';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const MAIN = 'dharm-weave-sync.json';
  const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
  const LS = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
  const LSset = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };
  const cid = () => LS('dharm_gcid') || window.DHARM_GOOGLE_CLIENT_ID || '';
  const connected = () => LS('dharm_gconn') === '1';
  const auto = () => LS('dharm_gauto') !== '0';
  const getCurU = () => +LS('dharm_cur_u') || 0;
  const getDel = () => { try { return JSON.parse(LS('dharm_del') || '{}') || {} } catch (e) { return {} } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let st = { state: 'off', msg: '' };       // off | pending | busy | ok | err | reauth
  let tok = null, exp = 0, client = null, clientFor = '', gisP = null, tokWait = null;
  let busy = false, again = false, applying = false, timer = null, armed = false;
  let lastS = '', lastQ = '';
  try { const t = JSON.parse(LS('dharm_gtok') || 'null'); if (t && t.e > Date.now() + 60000) { tok = t.t; exp = t.e } } catch (e) {}

  /* ---------- status chip + menu label ---------- */
  const chip = document.createElement('button');
  chip.id = 'syncchip'; chip.className = 'syncchip'; chip.hidden = true; chip.type = 'button';
  chip.addEventListener('click', () => openDlg(true));
  document.body.appendChild(chip);
  const hhmm = t => t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  function setState(s, msg) {
    st = { state: s, msg: msg || '' };
    const last = +LS('dharm_glast') || 0;
    const map = {
      off: ['', 'Not connected'], pending: ['☁ …', 'Changes waiting to sync'], busy: ['☁ Syncing…', 'Syncing…'],
      ok: ['☁ ✓ ' + hhmm(last), 'Synced ' + hhmm(last)], err: ['☁ ⚠ Sync error', 'Error: ' + (msg || '')],
      reauth: ['☁ ⚠ Tap to reconnect', 'Tap anywhere to reconnect']
    };
    const m = map[s] || map.off;
    chip.hidden = !connected(); chip.textContent = m[0]; chip.dataset.s = s; chip.title = m[1];
    const sub = document.getElementById('gdsub'); if (sub) sub.textContent = connected() ? m[1] : 'Back up & sync across devices';
    if (document.getElementById('gdlg')) drawDlg();
  }

  /* ---------- Google sign-in (token flow) ---------- */
  function loadGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (gisP) return gisP;
    gisP = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => { gisP = null; rej(new Error('Could not reach Google (offline?)')) };
      document.head.appendChild(s);
    });
    return gisP;
  }
  async function getToken(interactive) {
    if (tok && Date.now() < exp - 60000) return tok;
    if (!interactive) { const e = new Error('reauth'); e.reauth = true; throw e }
    if (!cid()) throw new Error('Enter your Google Client ID first');
    await loadGIS();
    if (!client || clientFor !== cid()) {
      clientFor = cid();
      client = google.accounts.oauth2.initTokenClient({
        client_id: clientFor, scope: SCOPE,
        callback: r => { const w = tokWait; tokWait = null; if (!w) return; r.error ? w.rej(new Error(r.error_description || r.error)) : w.res(r) },
        error_callback: e => { const w = tokWait; tokWait = null; w && w.rej(new Error(e && e.type === 'popup_closed' ? 'Sign-in window was closed' : 'Sign-in popup was blocked or failed')) }
      });
    }
    const r = await new Promise((res, rej) => { tokWait = { res, rej }; client.requestAccessToken({ prompt: '' }) });
    tok = r.access_token; exp = Date.now() + (+r.expires_in || 3600) * 1000;
    LSset('dharm_gtok', JSON.stringify({ t: tok, e: exp }));
    return tok;
  }
  function armReauth() {
    if (armed) return; armed = true;
    const go = () => { armed = false; ['pointerdown', 'keydown'].forEach(ev => document.removeEventListener(ev, go, true)); sync('gesture', true) };
    ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, go, true));
  }

  /* ---------- Drive REST helpers ---------- */
  async function api(url, opt, interactive) {
    const t = await getToken(interactive);
    let r;
    try { r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + t }, (opt && opt.headers) || {}) })) }
    catch (e) { throw new Error('Network problem - will retry') }
    if (r.status === 401) { tok = null; exp = 0; LSset('dharm_gtok', null); const e = new Error('reauth'); e.reauth = true; throw e }
    if (!r.ok) { let m = ''; try { m = (await r.json()).error.message } catch (e) {} throw new Error('Drive error ' + r.status + (m ? ': ' + m : '')) }
    return r;
  }
  async function listAll(inter) {
    let out = [], pt = '';
    do {
      const r = await api(API + '/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)' + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''), {}, inter);
      const j = await r.json(); out = out.concat(j.files || []); pt = j.nextPageToken || '';
    } while (pt);
    return out;
  }
  const dl = async (id, inter) => (await api(API + '/files/' + id + '?alt=media', {}, inter)).text();
  async function put(name, text, id, inter) {
    if (text.length > 4e6) {   // resumable for big attachments
      const init = await api(UP + '/files' + (id ? '/' + id : '') + '?uploadType=resumable&fields=id', {
        method: id ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(id ? { name } : { name, parents: ['appDataFolder'] })
      }, inter);
      const loc = init.headers.get('Location'); if (!loc) throw new Error('Drive upload could not start');
      const r = await fetch(loc, { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: text });
      if (!r.ok) throw new Error('Drive upload failed ' + r.status);
      return (await r.json()).id;
    }
    const b = 'dharm' + Math.random().toString(36).slice(2);
    const meta = JSON.stringify(id ? { name } : { name, parents: ['appDataFolder'] });
    const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n' + text + '\r\n--' + b + '--';
    const r = await api(UP + '/files' + (id ? '/' + id : '') + '?uploadType=multipart&fields=id', {
      method: id ? 'PATCH' : 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body
    }, inter);
    return (await r.json()).id;
  }

  /* ---------- merge ---------- */
  const qU = q => +q.u || (typeof q.id === 'number' ? q.id : 0) || 0;
  const pick = r => ({ v: 1, app: 'Dharm Textiles', curU: +r.curU || 0, current: r.current || null, qualities: r.qualities || [], deleted: r.deleted || {} });
  const docIds = x => (x && x.docs || []).map(d => d.id).filter(Boolean);

  async function sync(reason, inter) {
    if (!connected() || !cid()) return;
    if (busy) { again = true; return }
    busy = true; clearTimeout(timer); setState('busy');
    try {
      const files = await listAll(inter), by = new Map(files.map(f => [f.name, f.id]));
      let remote = null;
      if (by.has(MAIN)) {
        const txt = await dl(by.get(MAIN), inter);
        try { remote = JSON.parse(txt) } catch (e) { throw new Error('The cloud file is unreadable - nothing was overwritten') }
      }
      const r = remote ? pick(remote) : { v: 1, curU: 0, current: null, qualities: [], deleted: {} };

      /* qualities: newest save wins, deletions remembered */
      const del = Object.assign({}, getDel()); for (const k in r.deleted) del[k] = Math.max(del[k] || 0, +r.deleted[k] || 0);
      const map = new Map();
      const add = q => { if (!q || !q.name || !q.s) return; const o = map.get(q.name); if (!o || qU(q) > qU(o)) map.set(q.name, q) };
      Q.forEach(add); (r.qualities || []).forEach(add);
      const merged = [];
      map.forEach((q, name) => { if (del[name] && del[name] >= qU(q)) return; merged.push({ id: q.id, name: q.name, party: q.party || '', u: qU(q), s: q.s }) });
      merged.sort((a, b) => a.id - b.id);

      /* current (open) quality: newest edit wins */
      const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
      const lcu = getCurU(); let adopt = !!(r.current && r.curU > lcu && !typing);
      let payCur = adopt ? r.current : S, payU = adopt ? r.curU : Math.max(lcu, 0);
      if (typing && r.current && r.curU > lcu) { payCur = r.current; payU = r.curU }   // don't clobber remote while user is typing

      const payload = pick({ curU: payU, current: payCur, qualities: merged, deleted: del });
      const same = remote && JSON.stringify(payload) === JSON.stringify(pick(remote));

      /* attachments */
      const ids = new Set([...docIds(payCur), ...merged.flatMap(q => docIds(q.s))]);
      let got = 0;
      for (const id of ids) {
        const nm = 'f-' + id; let have; try { have = await idbGet(id) } catch (e) { continue }
        if (have && !by.has(nm)) { by.set(nm, await put(nm, have, null, inter)) }
        else if (!have && by.has(nm)) { try { await idbPut(id, await dl(by.get(nm), inter)); got++ } catch (e) {} }
      }

      /* upload if the merged result differs from what is in the cloud */
      if (!same) await put(MAIN, JSON.stringify(Object.assign({ updated: new Date().toISOString() }, payload)), by.get(MAIN) || null, inter);

      /* apply to this device */
      const localJ = JSON.stringify(Q.map(q => ({ n: q.name, u: qU(q), s: q.s })));
      const newJ = JSON.stringify(merged.map(q => ({ n: q.name, u: q.u, s: q.s })));
      const qChanged = localJ !== newJ || got > 0;
      if (qChanged || adopt || JSON.stringify(del) !== LS('dharm_del')) {
        applying = true;
        try {
          if (adopt && S && S.name && S.name.trim()) {          // keep a copy of what was open, never lose it
            const ex = Q.find(q => q.name === S.name.trim());
            if (!ex || JSON.stringify(ex.s) !== JSON.stringify(S)) {
              let nm = S.name.trim() + ' (this device ' + new Date().toISOString().slice(0, 10) + ')';
              const n = Date.now(); if (!map.has(nm) && !merged.some(q => q.name === nm)) merged.push({ id: n, name: nm, party: S.party || '', u: n, s: JSON.parse(JSON.stringify(S)) });
            }
          }
          Q.length = 0; merged.forEach(q => Q.push({ id: q.id, name: q.name, party: q.party, u: q.u, s: normS(q.s) }));
          if (adopt) { S = normS(r.current); LSset('dharm_cur_u', String(r.curU)) }
          LSset('dharm_del', JSON.stringify(del));
          save(); lastS = JSON.stringify(S); lastQ = JSON.stringify(Q);
        } finally { applying = false }
        if (adopt || qChanged) { try { render() } catch (e) {} }
      }
      LSset('dharm_glast', String(Date.now()));
      setState('ok');
    } catch (e) {
      if (e && e.reauth) { setState('reauth'); armReauth() } else setState('err', e && e.message || 'failed');
    } finally {
      busy = false;
      if (again) { again = false; timer = setTimeout(() => sync('again'), 800) }
    }
  }

  /* ---------- hooks called by the app ---------- */
  function changed() {
    if (applying) return;
    let js, jq; try { js = JSON.stringify(S); jq = JSON.stringify(Q) } catch (e) { return }
    if (!lastS) { lastS = js; lastQ = jq; return }               // baseline, no bump
    if (js === lastS && jq === lastQ) return;
    if (js !== lastS) LSset('dharm_cur_u', String(Date.now()));
    lastS = js; lastQ = jq;
    if (!connected() || !auto()) return;
    setState('pending'); clearTimeout(timer); timer = setTimeout(() => sync('edit'), 4000);
  }
  function tomb(name) { const d = getDel(); d[name] = Date.now(); LSset('dharm_del', JSON.stringify(d)) }

  /* ---------- connect / disconnect ---------- */
  async function connect() {
    try {
      await getToken(true); LSset('dharm_gconn', '1'); setState('busy');
      try { const r = await api(API + '/about?fields=user(emailAddress)', {}, false); LSset('dharm_gemail', (await r.json()).user.emailAddress) } catch (e) {}
      await sync('connect', true); startPoll();
    } catch (e) { setState(connected() ? 'err' : 'off', e.message); alert('Could not connect: ' + e.message) }
  }
  function disconnect() {
    if (!confirm('Disconnect Google Drive on this device?\n\nYour data stays on this device and in your Drive backup. Auto-sync will stop here.')) return;
    try { tok && window.google && google.accounts.oauth2.revoke(tok, () => {}) } catch (e) {}
    ['dharm_gconn', 'dharm_gtok', 'dharm_gemail', 'dharm_glast'].forEach(k => LSset(k, null));
    tok = null; exp = 0; clearTimeout(timer); setState('off'); drawDlg();
  }
  let pollT = null;
  function startPoll() {
    if (pollT) return;
    pollT = setInterval(() => { if (document.visibilityState === 'visible' && connected() && auto() && st.state !== 'reauth') sync('poll') }, 90000);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && connected() && auto()) sync('visible') });
  addEventListener('online', () => { if (connected() && auto()) sync('online') });

  /* ---------- dialog ---------- */
  const SETUP = `<ol style="padding-left:18px;margin:6px 0;font-size:12.5px;line-height:1.55">
   <li>Open <b>console.cloud.google.com</b> → create a project (any name).</li>
   <li><b>APIs &amp; Services → Library</b> → enable <b>Google Drive API</b>.</li>
   <li><b>OAuth consent screen</b> (Google Auth Platform) → External → fill app name &amp; your email → add scope <code>.../auth/drive.appdata</code> → add your Google account(s) as <b>Test users</b> (or publish the app).</li>
   <li><b>Credentials → Create credentials → OAuth client ID → Web application</b>. Under <b>Authorized JavaScript origins</b> add your site address, e.g. <code>https://yourname.github.io</code> (no path, no trailing slash). Add <code>http://localhost:8000</code> if you test locally.</li>
   <li>Copy the <b>Client ID</b> and paste it above (or put it in <code>js/config.js</code> so all devices get it).</li>
   <li>Use the <b>same Google account</b> on every device.</li></ol>`;
  function drawDlg() {
    const o = document.getElementById('gdlg'); if (!o) return;
    const last = +LS('dharm_glast') || 0, email = LS('dharm_gemail');
    const badge = { off: '#64748b', pending: '#b45309', busy: '#0e7490', ok: '#15803d', err: '#b91c1c', reauth: '#b45309' }[st.state] || '#64748b';
    const stTxt = connected() ? ({ pending: 'Changes waiting to sync…', busy: 'Syncing…', ok: 'Synced' + (last ? ' at ' + new Date(last).toLocaleString() : ''), err: 'Error: ' + esc(st.msg), reauth: 'Session expired - click anywhere / Sync now to reconnect' }[st.state] || 'Connected') : 'Not connected';
    let h = `<div style="background:#fff;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:16px">
     <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="flex:1;font-size:17px">☁ Google Drive sync</b><button class="btn" data-g="close">Close</button></div>
     <div style="padding:9px 12px;border-radius:8px;background:#f1f5f9;margin-bottom:10px;font-size:13px"><b style="color:${badge}">● ${stTxt}</b>${connected() && email ? '<br><small>Account: ' + esc(email) + '</small>' : ''}</div>`;
    if (!connected()) {
      h += `<label style="font-size:12px;color:#475569">Google OAuth Client ID<input id="gcid" placeholder="123456789-abc....apps.googleusercontent.com" value="${esc(cid())}"></label>
       <div class="bar" style="margin-top:10px"><button class="btn p" data-g="connect">Connect Google Drive</button></div>`;
    } else {
      h += `<div class="bar"><button class="btn p" data-g="sync">Sync now</button><button class="btn d" data-g="disc">Disconnect</button></div>
       <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px;color:#0f172a"><input type="checkbox" id="gauto" style="width:auto;margin:0" ${auto() ? 'checked' : ''}> Auto-sync (upload ~4 s after each change, check for other devices' changes every 90 s)</label>`;
    }
    h += `<details style="margin-top:10px"${cid() ? '' : ' open'}><summary style="cursor:pointer;font-weight:700;font-size:13px">One-time setup &amp; how it works</summary>${SETUP}
     <p style="font-size:12px;color:#475569;margin:6px 0 0">Data goes only to a hidden app folder in <b>your own</b> Google Drive (it does not appear in My Drive and the app cannot see your other files). Sign-in lasts about an hour; after that the next click or keystroke silently renews it. Qualities are merged by name - the most recent save wins - and deleted qualities stay deleted on every device.</p></details></div>`;
    o.innerHTML = h;
  }
  function openDlg() {
    let o = document.getElementById('gdlg'); if (o) o.remove();
    o = document.createElement('div'); o.id = 'gdlg';
    o.style.cssText = 'position:fixed;inset:0;z-index:99990;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px';
    o.addEventListener('click', e => {
      if (e.target === o) return o.remove();
      const b = e.target.closest('[data-g]'); if (!b) return; const a = b.dataset.g;
      if (a === 'close') o.remove();
      else if (a === 'connect') { const v = (document.getElementById('gcid').value || '').trim(); if (!/\.apps\.googleusercontent\.com$/.test(v)) return alert('Paste the full Client ID (ends with .apps.googleusercontent.com).'); LSset('dharm_gcid', v); connect() }
      else if (a === 'sync') sync('user', true);
      else if (a === 'disc') disconnect();
    });
    o.addEventListener('change', e => { if (e.target.id === 'gauto') { LSset('dharm_gauto', e.target.checked ? '1' : '0'); if (e.target.checked) sync('auto-on', true) } });
    document.body.appendChild(o); drawDlg();
  }
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-gd]'); if (b) openDlg() });

  /* ---------- start ---------- */
  function init() {
    try { lastS = JSON.stringify(S); lastQ = JSON.stringify(Q) } catch (e) {}
    setState(connected() ? (tok ? 'ok' : 'reauth') : 'off');
    if (connected()) { startPoll(); if (tok) sync('start'); else armReauth() }
  }
  window.DriveSync = { changed, tomb, open: openDlg, sync: () => sync('api', true) };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
